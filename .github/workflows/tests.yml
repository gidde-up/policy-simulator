name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pipeline + engine test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Run test suite (validation + engine + presets)
        working-directory: data-pipeline
        run: python -m pytest -v

  backend-boot:
    name: backend imports and contract smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Boot the app and exercise the API contract
        working-directory: backend
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          r = client.post("/api/simulate", json={
              "country_code": "ZAF",
              "tariff_changes": {"manufacturing": 10}})
          assert r.status_code == 200, r.text
          d = r.json()
          assert d["aggregate"]["total_jobs"] < 0  # acceptance constraint
          assert d["tariff_channels"]["protected_sector_gain"]["jobs"] > 0
          assert "research-grade" not in r.text
          for path in ["/api/countries", "/api/sectors", "/api/presets",
                       "/api/assumptions", "/api/limitations",
                       "/api/multipliers/SEN"]:
              r = client.get(path)
              assert r.status_code == 200, f"{path}: {r.status_code}"
          print("backend contract smoke OK")
          EOF

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
